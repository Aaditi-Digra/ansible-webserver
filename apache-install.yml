---
- name: Install and Configuration Apache
  hosts: webservers
  become: true
  become_user: root

  tasks:
    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true
    - name: Enable service and start service
      ansible.builtin.service:
        name: apache2
        enabled: true
        state: started
    - name: Remove the existing index.html
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent
    - name: Create a new empty index.html file
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: touch
        owner: root
        group: root
        mode: "0755"
    - name: Add content to the index.html file
      ansible.builtin.lineinfile:
        path: /var/www/html/index.html
        line: Hello Ansible World!
